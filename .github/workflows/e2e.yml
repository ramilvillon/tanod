name: E2E

on:
  # Weekly, Mondays 04:42 UTC (offset from the audit cron). The e2e suite
  # exercises the Drizzle repository against a real MySQL; a schedule catches
  # environment drift (database image, driver) independent of code changes.
  schedule:
    - cron: '42 4 * * 1'
  # Run on demand, e.g. after touching the schema, migrations, or db adapter.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        # Steps only start once MySQL answers as the app user, so migrations
        # don't race the container's first-boot initialization.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uapp -papp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
      # Mail catcher: SMTP on 1025, HTTP API on 8025. Lets the SMTP sender be
      # exercised against a real server rather than a stub, with no account and
      # no secrets. Nothing leaves the runner.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.13
          cache: true

      # The db/test tasks read --env-file=.env; .env.example already sets
      # DB_HOST/DB_PORT to localhost:3306, matching the service container above.
      #
      # The JWT keys cannot simply be copied: .env.example ships them EMPTY and
      # config.ts requires min(1), so `cp .env.example .env` produces a file
      # that fails validation the moment anything calls loadConfig. Nor can the
      # generated keys just be appended -- Deno's --env-file is FIRST-wins, so
      # the empty placeholder would beat them. Strip the placeholders, then
      # generate a throwaway pair for this run.
      - name: Configure environment
        run: |
          # Strip EVERY key this step overrides, not just some: --env-file is
          # first-wins, so any placeholder left behind silently beats the value
          # appended below. Leaving SMTP_PORT=587 in place is exactly how the
          # first attempt at this connected to 587 and got ECONNREFUSED.
          grep -vE '^(JWT_PRIVATE_KEY|JWT_PUBLIC_KEY|SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_PASS|SMTP_SECURE|EMAIL_FROM)=' .env.example > .env
          deno task keys:gen >> .env
          # Point the SMTP sender at the mailpit service. SMTP_HOST is what
          # switches deps.ts from the log sender to the real one, so setting it
          # here is what puts the transport under test at all.
          echo 'SMTP_HOST=127.0.0.1' >> .env
          echo 'SMTP_PORT=1025' >> .env
          echo 'EMAIL_FROM=tanod-e2e@example.test' >> .env

      - name: Apply migrations
        run: deno task db:migrate

      - name: Seed RBAC roles + permissions
        run: deno task db:seed

      - name: Run e2e tests
        # MAILPIT_API is read by the SMTP test to read back what was delivered.
        env:
          MAILPIT_API: http://127.0.0.1:8025
        run: deno task test:e2e

      # The same integration suite that runs on in-memory fakes, run again on the
      # drizzle repositories. The fakes are more permissive than MySQL; this is
      # where that divergence shows up. It gets its own database because every
      # test truncates every table.
      - name: Run integration tests on MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE app_test; GRANT ALL ON app_test.* TO 'app'@'%';"
          DB_NAME=app_test deno task db:migrate
          DB_NAME=app_test deno task db:seed
          deno task test:integration:mysql
